<style>

      font-variation-settings: 'FILL' 0, 'wght' 500, 'GRAD' 0, 'opsz' 24;
    }

      0%, 100% { transform: scale(1); opacity: 1; }

    }

      animation: pulse-dot 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
    }

      stroke-dasharray: 8 6;
      animation: dash-flow 25s linear infinite;

<body class="bg-black text-on-surface select-none overflow-hidden m-0 p-0 font-body-md text-body-md antialiased min-h-screen flex justify-center items-center">
<!-- Mobile Screen Container (Android 4-column layout standard) -->
<main class="relative w-full max-w-md h-[100dvh] overflow-hidden bg-black flex flex-col justify-between">
<!-- Camera Viewfinder Background Image (Red onion field crop close-up) -->
<div class="absolute inset-0 z-0 bg-cover bg-center opacity-85" data-alt="A vivid high-definition close-up shot of vibrant green red onion leaves in an agricultural field in Lurín, Peru under sharp direct sunlight. The rich sandy soil and deep green tubular scallion stalks create high contrast outdoor agricultural textures. High-contrast natural daylight with crisp shadows highlighting healthy plant tissue and diagnostic textures in a modern agronomy setting." style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuAPpYBHRFIbiPiO_gJURlO1hgT1aCvnGc4AJfTjGn1SfjccR0b5EIaN3Ok7RiffcmSCMCKSSZxsuHy91E3UvD8RleymwukSP6ZuH3OCOvooRbU5V-ywgDgPUvZC3G-LP4Njd5poIweX_gCv6jjkuQR1juyivz1VKDiPbFu2SZNkFnFMPQ0k6tdq9IBwrAtbEo9NtNQEi1FR3a4SXJ3jfDZl1oDcYskRNnY6_OXuDhWLH5r9kYaP5e2K');">
</div>
<!-- Sunlight Anti-Glare Overlays for Camera View -->
<div class="absolute inset-0 z-0 bg-gradient-to-b from-black/80 via-transparent to-black/90 pointer-events-none"></div>
<!-- Offline-First Sync Banner (From Design System) -->
<div class="relative z-30 pt-2 px-margin-mobile flex justify-center">
<div class="inline-flex items-center gap-2 px-3 py-1 rounded-full shadow-md" style="background-color: rgb(255, 160, 0); color: rgb(28, 27, 31);"><span class="material-symbols-outlined text-[16px]" data-icon="cloud_off">cloud_off</span><span class="font-label-md text-label-md font-bold text-[#1c1b1f]">Modo Local — 3 Registros Pendientes</span></div>
</div>
<!-- Top Header Overlay: 48dp Touch Targets with Heavy Anchor -->
<header class="relative z-30 flex items-center justify-between px-margin-mobile py-spacing-8" style="background: linear-gradient(rgba(0, 0, 0, 0.85) 0%, rgba(0, 0, 0, 0.5) 75%, transparent 100%);">
<!-- Back Action -->
<button aria-label="Volver al panel" class="w-spacing-48 h-spacing-48 rounded-full bg-black/60 backdrop-blur-md border border-outline-variant/40 flex items-center justify-center text-white active:scale-95 transition-transform" type="button">
<span class="material-symbols-outlined text-[26px]" data-icon="arrow_back">arrow_back</span>
</button>
<!-- Center Screen Title -->
<div class="flex flex-col items-center">
<span class="text-white font-title-lg text-title-lg tracking-tight drop-shadow-md">Captura de Hoja</span>
<span class="text-inverse-primary font-label-md text-label-md font-bold tracking-wider uppercase">Sector B-14 Lurín</span>
</div>
<!-- Flash Toggle Button (Linterna) -->
<button aria-label="Alternar Linterna" class="w-spacing-48 h-spacing-48 rounded-full bg-black/60 backdrop-blur-md border border-outline-variant/40 flex items-center justify-center text-white active:scale-95 transition-transform hover:bg-black/80" id="flash-toggle" type="button">
<span class="material-symbols-outlined text-[24px] text-tertiary-fixed" data-icon="flash_on" data-weight="fill" id="flash-icon" style="font-variation-settings: 'FILL' 1;">flash_on</span>
</button>
</header>
<!-- Floating Dynamic Feedback Pill (Optimal Distance / Good Light) -->
<div class="relative z-20 flex justify-center px-margin-mobile">
<div class="inline-flex items-center gap-2.5 bg-surface-container-lowest/95 backdrop-blur-md px-spacing-16 py-spacing-8 rounded-full border-2 border-primary-container shadow-lg">
<span class="w-2.5 h-2.5 rounded-full bg-primary-container status-pulse shrink-0"></span>
<span class="text-primary font-label-lg text-label-lg font-bold">Distancia óptima • Buena iluminación</span>
</div>
</div>
<!-- Center Camera Viewfinder: Silhouette of Elongated Onion Leaf (Allium Cepa) with Crosshairs -->
<div class="relative z-10 flex-1 flex flex-col items-center justify-center px-6 pointer-events-none">
<div class="relative w-full max-w-[280px] h-[320px] flex items-center justify-center">
<!-- Viewfinder Reticle Frame (High contrast for direct sunlight) -->
<div class="absolute -top-3 -left-3 w-6 h-6 border-t-4 border-l-4 border-inverse-primary"></div>
<div class="absolute -top-3 -right-3 w-6 h-6 border-t-4 border-r-4 border-inverse-primary"></div>
<div class="absolute -bottom-3 -left-3 w-6 h-6 border-b-4 border-l-4 border-inverse-primary"></div>
<div class="absolute -bottom-3 -right-3 w-6 h-6 border-b-4 border-r-4 border-inverse-primary"></div>
<!-- Onion Leaf (Allium Cepa) Vector Guidance Target Outline -->
<svg class="w-full h-full drop-shadow-[0_2px_8px_rgba(0,0,0,0.8)]" fill="none" viewBox="0 0 200 300" xmlns="http://www.w3.org/2000/svg">
<!-- Crosshair Guidelines -->
<line stroke="#91d78a" stroke-linecap="round" stroke-width="2" x1="100" x2="100" y1="15" y2="45"></line>
<line stroke="#91d78a" stroke-linecap="round" stroke-width="2" x1="100" x2="100" y1="255" y2="285"></line>
<line stroke="#91d78a" stroke-linecap="round" stroke-width="2" x1="15" x2="45" y1="150" y2="150"></line>
<line stroke="#91d78a" stroke-linecap="round" stroke-width="2" x1="155" x2="185" y1="150" y2="150"></line>
<!-- Central Alignment Circle -->
<circle cx="100" cy="150" r="12" stroke="#91d78a" stroke-dasharray="3 3" stroke-width="1.5"></circle>
<circle cx="100" cy="150" fill="#91d78a" r="2.5"></circle>
<!-- Onion Leaf Slender Tubular Silhouette (Allium Cepa) -->
<path class="dashed-leaf" d="M99 22 C98 50, 93 110, 92 180 C91 225, 93 265, 95 288 L105 288 C107 265, 109 225, 108 180 C107 110, 102 50, 101 22 Z" fill="rgba(145, 215, 138, 0.12)" stroke="#91d78a" stroke-width="2.5"></path>
</svg>
<!-- Dynamic Guidance Label Inside Reticle -->
<div class="absolute bottom-6 px-3 py-1.5 rounded-lg bg-black/75 backdrop-blur-sm border border-outline-variant/30">
<p class="text-white font-label-md text-label-md font-bold text-center tracking-wide">
            Enfoque la hoja de cebolla aquí
          </p>
</div>
</div>
</div>
<!-- Lower Operational Section: Helper Card & Large Thumb-Zone Controls -->
<div class="relative z-30 flex flex-col gap-spacing-12 pb-8 px-margin-mobile">
<!-- Bottom Guidance Card (High Contrast Level 1 Card) -->
<div class="bg-surface-container-lowest rounded-xl p-spacing-12 border-2 border-outline-variant shadow-lg flex items-center gap-3">
<div class="w-10 h-10 rounded-full bg-primary/10 flex items-center justify-center shrink-0">
<span class="material-symbols-outlined text-primary text-[24px]" data-icon="wb_sunny">wb_sunny</span>
</div>
<div class="flex-1">

          </p>
</div>
</div>
<!-- Bottom Camera Controls Row (Designed for one-handed rural operation) -->
<div class="flex items-center justify-between px-2 pt-spacing-8">
<!-- Left Action: Galería / Cargar imagen (Min 56px touch target) -->
<button aria-label="Abrir Galería de Fotos" class="flex flex-col items-center justify-center w-14 h-14 rounded-full bg-surface-container-lowest/90 backdrop-blur-md border-2 border-outline-variant active:scale-95 transition-transform shadow-md" type="button">
<span class="material-symbols-outlined text-on-surface text-[26px]" data-icon="photo_library">photo_library</span>
<span class="text-[10px] font-bold text-on-surface -mt-0.5">Galería</span>
</button>
<!-- Center Shutter Button: Extra large circular trigger (72dp diameter) with Forest Green core -->
<div class="relative flex items-center justify-center">
<!-- Haptic feedback outer pulse ring -->
<div class="absolute w-24 h-24 rounded-full border-2 border-inverse-primary/60 animate-ping opacity-25"></div>
<button aria-label="Capturar fotografía de hoja" class="relative z-10 w-[76px] h-[76px] rounded-full p-1 bg-white border-4 border-surface-container-highest shadow-[0_4px_16px_rgba(0,0,0,0.5)] active:scale-90 transition-transform flex items-center justify-center" id="shutter-button" type="button">
<div class="w-full h-full rounded-full bg-primary-container flex items-center justify-center hover:bg-primary transition-colors">
<span class="material-symbols-outlined text-white text-[32px]" data-icon="camera" data-weight="fill" style="font-variation-settings: 'FILL' 1;">camera</span>
</div>
</button>
</div>
<!-- Right Action: Macro Focus / Crop Switch Toggle -->
<button aria-label="Alternar Enfoque Macro" class="flex flex-col items-center justify-center w-14 h-14 rounded-full bg-surface-container-lowest/90 backdrop-blur-md border-2 border-outline-variant active:scale-95 transition-transform shadow-md" id="macro-toggle" type="button">
<span class="material-symbols-outlined text-primary text-[26px]" data-icon="center_focus_strong">center_focus_strong</span>
<span class="text-[10px] font-bold text-on-surface -mt-0.5">Macro</span>
</button>
</div>
</div>
</main>
<script>
    // Lightweight tactile micro-interactions for field usability
    document.addEventListener('DOMContentLoaded', () => {
      const shutterBtn = document.getElementById('shutter-button');
      const flashBtn = document.getElementById('flash-toggle');
      const flashIcon = document.getElementById('flash-icon');
      const macroBtn = document.getElementById('macro-toggle');

      let flashActive = true;
      let macroActive = false;

      // Flash Toggle Handler
      if (flashBtn && flashIcon) {
        flashBtn.addEventListener('click', () => {
          flashActive = !flashActive;
          if (flashActive) {
            flashIcon.textContent = 'flash_on';
            flashIcon.classList.remove('text-outline-variant');
            flashIcon.classList.add('text-tertiary-fixed');
            flashBtn.classList.remove('bg-black/40');
            flashBtn.classList.add('bg-black/60');
          } else {
            flashIcon.textContent = 'flash_off';
            flashIcon.classList.remove('text-tertiary-fixed');
            flashIcon.classList.add('text-outline-variant');
            flashBtn.classList.remove('bg-black/60');
            flashBtn.classList.add('bg-black/40');
          }
        });
      }

      // Shutter Trigger Visual Feedback
      if (shutterBtn) {
        shutterBtn.addEventListener('click', () => {
          // Trigger momentary flash effect
          const flashDiv = document.createElement('div');
          flashDiv.className = 'absolute inset-0 bg-white z-50 pointer-events-none transition-opacity duration-300 opacity-90';
          document.body.appendChild(flashDiv);
          setTimeout(() => {
            flashDiv.style.opacity = '0';
            setTimeout(() => flashDiv.remove(), 300);
          }, 60);
        });
      }

      // Macro Mode Toggle
      if (macroBtn) {
        macroBtn.addEventListener('click', () => {
          macroActive = !macroActive;
          if (macroActive) {
            macroBtn.classList.add('border-primary', 'bg-primary-container/20');
          } else {
            macroBtn.classList.remove('border-primary', 'bg-primary-container/20');
          }
        });
      }
    });
  </script>
